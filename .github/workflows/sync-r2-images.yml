name: Sync coloring images to R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-r2-images
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3
      - name: Upload and verify originals and thumbnails
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: kidslovecolor-images
        run: python -c "from r2_storage import check_access, sync_images; check_access(); sync_images('.')"
